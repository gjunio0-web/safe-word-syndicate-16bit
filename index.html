    <!-- The share card. Three things here are not stylistic preference:
       *
       * Absolute URL, because WhatsApp refuses a relative one and falls back to
       * a bare line of text — the worst possible advert for a game whose entire
       * argument is being seen.
       *
       * JPEG, not the WebP everything else in this tree uses. WebP support in
       * link previews is inconsistent on older Android clients, and it fails
       * silently: no error, no image, and the blank card gets cached on the
       * device. There is no way to force a refresh.
       *
       * Declared dimensions, so a crawler can choose the wide layout before it
       * has finished downloading anything. -->
    <meta property="og:image" content="https://safe-word-syndicate.netlify.app/og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1037" />
    <meta
      property="og:image:alt"
      content="The four heroes of the Safe-Word Syndicate walking down a neon street, the grey Purity Patrol massed behind them."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://safe-word-syndicate.netlify.app/og-card.jpg" />
